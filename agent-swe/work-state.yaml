    - "新产品功能及与上游升级无关的重构"

constraints:
  required:
    - "先核实当前真实 GitHub 分支与 PR，再继续修改"
    - "只有完整验收通过后才合并 PR #16"
  forbidden:
    - "未通过完整门禁就合并"
    - "未经授权发布 npm 或 GitHub Release"
  frozen:
    - "Narratica 是独立 DSH 插件 Bundle；卸载不得删除作品"
  deferred: []

acceptance:
  - "pnpm install --frozen-lockfile 成功"
  - "pnpm run check 全部通过"
  - "正式 DSH Profile 装配、Web 启动及导演恢复冒烟通过"
  - "确保归档/旧导演会话可安全恢复；无兼容性倒退"
  - "验收通过后自行合并 PR #16，且不等待 GitHub CI/Actions"

progress:
  current:
    - "复查 DSH rc.3 迁移分支的类型、运行时及集成兼容性"
  next:
    - "在具有 npm 网络的工作环境使用 pnpm 11.7.0 更新并提交 pnpm-lock.yaml"
    - "执行 pnpm run check、Profile bootstrap/contract 和正式 Web 冒烟并修复失败"
    - "完整验证通过后标记 PR ready 并自行合并"

decisions:
  - "保留上游官方 Session/Workspace Controller 与 keyed main Slot；不再覆盖 Conversation"
  - "Director history 使用官方 Session eventSource/retain，不额外复制会话数据库"

blockers:
