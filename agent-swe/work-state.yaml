phase:
  type: verification
  summary: "已完成主要代码适配；需要可解析 npm 依赖的环境完成锁文件、类型检查、集成验收"

scope:
  include:
    - "DSH/Cordis 基线、Client Slot、Session Controller、Typert、Profile 装配、锁文件及测试"
