packages:
  - 'packages/*/*'
  - 'packages/story-tools'
  - 'apps/*'

# Narratica 的内部包目前以 0.0.0 的 workspace 包形式互相引用。
# pnpm 11 默认不会自动把匹配版本的 workspace 包链接进来，
# 同时又会自动安装缺失的 peerDependencies，导致首次安装时错误地
# 前往 npm registry 查找不存在的 @narratica/* 私有包。
linkWorkspacePackages: true

# pnpm 11 默认启用 strictDepBuilds：依赖只要声明了安装/构建脚本，
# 未经仓库明确审核就会让 install 直接失败。
# 当前 DSH 兼容基线固定为 0.1.1-rc.2；安装脚本审批也只允许该基线。
allowBuilds:
  esbuild: true
  node-pty: true
  koffi: true
  '@deepseek-ai/dsh-subprocess-local@0.1.1-rc.2': true
  '@google/genai': false
  protobufjs: false
  node-addon-require-builtin: false

# dsh-typert-protocol 承载 Decorator / Remote 注册身份，必须保证整个
# Host / Client 运行时只加载一个物理模块实例。即使上游 package.json
# 使用 workspace:^ 发布为宽范围，这里仍固定到 Narratica 当前基线。
overrides:
  '@deepseek-ai/dsh-typert-protocol': 0.1.1-rc.2
