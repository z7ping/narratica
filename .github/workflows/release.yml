name: 发布 Narratica

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      mode:
        description: '操作模式：verify 只验证；resume 仅续发已存在的 published Release'
        required: true
        default: verify
        type: choice
        options:
          - verify
          - resume
      version:
        description: '发行版本，例如 0.1.0-alpha.3'
        required: true
        default: '0.1.0-alpha.3'
        type: string
      npm_tag:
        description: 'npm dist-tag，必须与版本阶段一致'
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - rc
          - latest

permissions:
  contents: write
  id-token: write

concurrency:
  group: narratica-release
  cancel-in-progress: false

env:
  CI: true

jobs:
  release:
    name: 验证并发布 Narratica
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 配置 pnpm 11.7.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: 配置 Node.js 24 与 npm Registry
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: 固定支持 Trusted Publishing 的 npm CLI
        run: npm install --global npm@11.19.0

      - name: 输出发行工具版本
        run: |
          node --version
          pnpm --version
          npm --version

      - name: 解析发行参数
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_FROM_EVENT: ${{ github.event.release.tag_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == 'release' ]]; then
            if [[ -z "$RELEASE_TAG_FROM_EVENT" || "$RELEASE_TAG_FROM_EVENT" != v* ]]; then
              echo "GitHub Release Tag 必须使用 v<semver> 形式，当前：${RELEASE_TAG_FROM_EVENT:-<empty>}"
              exit 1
            fi

            RELEASE_TAG="$RELEASE_TAG_FROM_EVENT"
            RELEASE_VERSION="${RELEASE_TAG#v}"
            SHOULD_PUBLISH=true
          else
            RELEASE_VERSION="$INPUT_VERSION"
            RELEASE_TAG="v$RELEASE_VERSION"
            case "$INPUT_MODE" in
              verify) SHOULD_PUBLISH=false ;;
              resume) SHOULD_PUBLISH=true ;;
              *)
                echo "不支持的手工操作模式：${INPUT_MODE:-<empty>}"
                exit 1
                ;;
            esac
          fi

          case "$RELEASE_VERSION" in
            *-alpha|*-alpha.*) EXPECTED_NPM_DIST_TAG=alpha ;;
            *-beta|*-beta.*) EXPECTED_NPM_DIST_TAG=beta ;;
            *-rc|*-rc.*) EXPECTED_NPM_DIST_TAG=rc ;;
            *-*)
              echo "不支持的预发布版本：$RELEASE_VERSION；仅支持 alpha / beta / rc"
              exit 1
              ;;
            *) EXPECTED_NPM_DIST_TAG=latest ;;
          esac

          if [[ "$EVENT_NAME" == 'release' ]]; then
            NPM_DIST_TAG="$EXPECTED_NPM_DIST_TAG"
          else
            NPM_DIST_TAG="$INPUT_NPM_TAG"
            if [[ "$NPM_DIST_TAG" != "$EXPECTED_NPM_DIST_TAG" ]]; then
              echo "npm dist-tag 与版本阶段不一致：$RELEASE_VERSION 应使用 $EXPECTED_NPM_DIST_TAG，当前为 $NPM_DIST_TAG"
              exit 1
            fi
          fi

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "NPM_DIST_TAG=$NPM_DIST_TAG" >> "$GITHUB_ENV"
          echo "SHOULD_PUBLISH=$SHOULD_PUBLISH" >> "$GITHUB_ENV"
          echo "发行参数：$RELEASE_VERSION / npm tag=$NPM_DIST_TAG / event=$EVENT_NAME / publish=$SHOULD_PUBLISH"

      - name: 验证正式发布或续发来源
        if: env.SHOULD_PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main

          if [[ "$GITHUB_EVENT_NAME" == 'release' ]]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Release Tag 必须指向 main 已包含的提交，当前 SHA：$GITHUB_SHA"
              exit 1
            fi
            exit 0
          fi

          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo "手工 resume 只能从 main 分支执行，当前：$GITHUB_REF"
            exit 1
          fi

          MAIN_SHA=$(git rev-parse origin/main)
          if [[ "$GITHUB_SHA" != "$MAIN_SHA" ]]; then
            echo "手工 resume 必须使用当前 main 最新提交：run=$GITHUB_SHA main=$MAIN_SHA"
            exit 1
          fi

          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          TAG_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
          if [[ "$TAG_SHA" != "$MAIN_SHA" ]]; then
            echo "手工 resume 要求 $RELEASE_TAG 精确指向当前 main：tag=$TAG_SHA main=$MAIN_SHA"
            exit 1
          fi

          RELEASE_DRAFT=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.draft')
          if [[ "$RELEASE_DRAFT" != 'false' ]]; then
            echo "手工 resume 只允许续发已 published 的 GitHub Release：$RELEASE_TAG"
            exit 1
          fi

          echo "续发目标验证通过：$RELEASE_TAG -> $MAIN_SHA"

      - name: 按锁文件安装依赖
        run: pnpm install --frozen-lockfile

      - name: 完整代码质量门禁
        run: pnpm run check

      - name: 生成单包发行态 Package Manifest
        run: pnpm run release:prepare -- "$RELEASE_VERSION" "$NPM_DIST_TAG"

      - name: 打包并验证真实 tarball
        run: pnpm run release:pack

      - name: 本地 tarball DSH Profile 与 Web 烟测
        run: pnpm run release:smoke:local -- "$RELEASE_VERSION"

      - name: 保存发行候选产物与烟测日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narratica-release-${{ github.run_id }}
          path: dist/release/
          if-no-files-found: ignore
          retention-days: 14

      - name: 发布唯一正式入口包
        if: env.SHOULD_PUBLISH == 'true'
        env:
          # 首次创建 npm 包时可临时配置 granular NPM_TOKEN；
          # 包建立并配置 Trusted Publisher 后可删除该 Secret，npm 会优先使用 OIDC。
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm run release:publish -- "$RELEASE_VERSION" "$NPM_DIST_TAG"

      - name: 从 npm Registry 只安装顶层入口并再次烟测
        if: env.SHOULD_PUBLISH == 'true'
        run: pnpm run release:smoke:registry -- "$RELEASE_VERSION"

      - name: 保存 Registry DSH Web 启动日志
        if: ${{ always() && env.SHOULD_PUBLISH == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: narratica-registry-smoke-${{ github.run_id }}
          path: dist/release/smoke-registry.log
          if-no-files-found: ignore
          retention-days: 14

      - name: 上传发行产物到当前 GitHub Release
        if: env.SHOULD_PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ENTRY_TGZ=$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/release/release-manifest.json','utf8'));const p=m.packages.find(x=>x.entry);if(!p)process.exit(2);process.stdout.write(p.tarball)")
          gh release upload "$RELEASE_TAG" \
            "dist/release/$ENTRY_TGZ" \
            "dist/release/release-manifest.json" \
            --clobber
