name: npm 首次发行认证诊断

on:
  push:
    branches:
      - fix/release-publish-hardening
    paths:
      - '.github/workflows/release-npm-auth-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  auth:
    name: 验证 NPM_TOKEN 与 @narratica scope
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 配置 Node.js 24 与 npm Registry
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: 固定发行使用的 npm CLI
        run: npm install --global npm@11.19.0

      - name: 验证首次发行认证
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo '::error::NPM_TOKEN 未配置。@narratica/* 尚未首次创建时不能只依赖 Trusted Publishing。'
            exit 1
          fi
          npm whoami >/dev/null
          npm access list packages @narratica --json >/dev/null
          echo 'NPM_TOKEN 有效，且当前凭据可以查询 @narratica scope。'
